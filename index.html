<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FICSIT Production Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>FICSIT Production Planner</h1>
        <p class="subtitle">
            Mobile-First Edition 
            <span class="version-badge">v2.0</span>
        </p>
    </header>
    
    <main class="container">
        <!-- Kontrollzentrum: Rezept & Zielrate -->
        <div class="card">
            <h2 class="card-header">Produktionsziel</h2>
            
            <div class="input-group" style="margin-bottom: 1rem;">
                <label for="recipe-select" class="input-label">Rezept auswählen</label>
                <select id="recipe-select" class="ficsit-select">
                    <option value="">Lade Datenbasis...</option>
                </select>
            </div>

            <div id="target-container" class="input-group" style="display: none;">
                <label for="target-rate" class="input-label">Ziel-Produktion (Items / min)</label>
                <input type="number" id="target-rate" class="ficsit-input" min="0.1" step="0.1" value="0">
            </div>
        </div>

        <!-- Dashboard / Zusammenfassung -->
        <div id="dashboard-card" class="card" style="display: none;">
            <h2 class="card-header">Ressourcenübersicht</h2>
            <div class="dashboard-grid">
                <div class="stat-box">
                    <div class="stat-label">Gebäude Total</div>
                    <div id="stat-machines" class="stat-value">0.0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Geschätzter Strom</div>
                    <div id="stat-power" class="stat-value" style="color: var(--success);">~0 MW</div>
                </div>
            </div>
        </div>

        <!-- Produktionsbaum / Ausgabebereich -->
        <div class="card">
            <h2 class="card-header">Produktionskette</h2>
            <div id="status-output">
                Bitte wähle ein Rezept aus, um die Produktion zu berechnen.
            </div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
