<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >

    <title>
        FICSIT Production Planner
    </title>

    style.css
</head>


<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

        <div class="top">

            <b>
                FICSIT
                <i>
                    Production Planner
                </i>
            </b>


            <span id="test">
                ENGINE
            </span>

        </div>


        <!-- =================================================
             PLANNER CONTROLS
             ================================================= -->

        <div class="controls">

            <!-- Produkt -->

            <label>

                Produkt

                <select id="product">

                    <option>
                        Lade Daten…
                    </option>

                </select>

            </label>


            <!-- Zielrate -->

            <label>

                Ziel / min

                <input
                    id="rate"
                    type="number"
                    min="0.1"
                    step="0.1"
                    value="20"
                >

            </label>


            <!-- Förderband -->

            <label>

                Max. Belt

                <select id="belt">

                    <option value="auto">
                        Auto
                    </option>

                    <option value="1">
                        Mk.1
                    </option>

                    <option value="2">
                        Mk.2
                    </option>

                    <option value="3">
                        Mk.3
                    </option>

                    <option value="4">
                        Mk.4
                    </option>

                    <option value="5">
                        Mk.5
                    </option>

                    <option value="6">
                        Mk.6
                    </option>

                </select>

            </label>

        </div>

    </header>


    <!-- =====================================================
         VIEW NAVIGATION
         ===================================================== -->

    <nav>

        <button
            data-view="network"
            class="active"
        >
            ⌘ Netzwerk
        </button>


        <button
            data-view="tree"
        >
            ☷ Baum
        </button>


        <button
            data-view="items"
        >
            ⚒ Gegenstände
        </button>


        <button
            data-view="machines"
        >
            ▥ Gebäude
        </button>

    </nav>


    <!-- =====================================================
         CONTENT
         ===================================================== -->

    <main>

        <section id="view">

            <div class="empty">
                Produkt und Zielrate auswählen.
            </div>

        </section>

    </main>


    <!-- =====================================================
         DASHBOARD / FOOTER
         ===================================================== -->

    <footer>

        <!-- Maschinen -->

        <span>

            <small>
                Maschinen
            </small>

            <strong id="machines">
                0
            </strong>

        </span>


        <!-- Rohstoffe -->

        <span>

            <small>
                Rohstoffe / min
            </small>

            <strong id="raw">
                0
            </strong>

        </span>


        <!-- Strom -->

        <span>

            <small>
                Strom
            </small>

            <strong id="power">
                0 MW
            </strong>

        </span>

    </footer>


    <!-- =====================================================
         APPLICATION
         ===================================================== -->

    app.jsscript>

</body>

</html>
