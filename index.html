<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>FICSIT Production Planner - VibeCoding Edition</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="header-inner">

            <div class="brand-row">
                <h1>
                    FICSIT
                    <span>Production Planner</span>
                </h1>

                <span id="test-status" class="test-status">
                    Tests: Läuft...
                </span>
            </div>

            <div class="controls">

                <!-- Wird weiterhin dynamisch aus DocsRecipes.json gefüllt -->
                <select id="recipe-select" class="ficsit-select">
                    <option value="">Lade Datenbasis...</option>
                </select>

                <div
                    id="target-container"
                    class="rate-control"
                    style="display: none;"
                >
                    <label for="target-rate">
                        Zielrate / min:
                    </label>

                    <input
                        type="number"
                        id="target-rate"
                        class="ficsit-input"
                        min="0.1"
                        step="0.1"
                        value="0"
                    >
                </div>

            </div>
        </div>
    </header>


    <!-- PRODUKTIONSBEREICH -->
    <main class="app-main">

        <div id="recipe-tree" class="recipe-tree">

            <div id="status-output" class="empty-state">
                Bitte wähle ein Rezept aus, um die Produktion zu berechnen.
            </div>

        </div>

    </main>


    <!-- FIXIERTER FOOTER -->
    <footer id="dashboard-card" class="app-footer">

        <div class="footer-inner">

            <div>
                <div class="stat-label">
                    Gesamt-Maschinen
                </div>

                <div id="stat-machines" class="stat-value">
                    0.0x
                </div>
            </div>


            <div class="stat-right">
                <div class="stat-label">
                    Strombedarf
                </div>

                <div id="stat-power" class="stat-value power">
                    0 MW
                </div>
            </div>

        </div>

    </footer>


    <script type="module" src="app.js"></script>

</body>
</html>
