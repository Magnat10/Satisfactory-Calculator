<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satisfactory Planer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>FICSIT Production Planner</h1>
        <p class="subtitle">Mobile-First Edition</p>
    </header>
    
    <main class="container" id="app-container">
        <!-- Auswahlbereich -->
        <div class="card" style="margin-bottom: 1rem;">
            <label for="recipe-select" class="input-label">Rezept auswählen:</label>
            <select id="recipe-select" class="ficsit-select">
                <option value="">Lade Datenbasis...</option>
            </select>
        </div>

        <!-- Ausgabebereich -->
        <div id="status-output" class="card">
            Bitte wähle ein Rezept aus, um die Produktion zu berechnen.
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
