<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FICSIT Production Planner</title><link rel="stylesheet" href="style.css"></head><body><main><h1>FICSIT <span>Production Planner</span></h1><p class="sub">Produktionsketten berechnen</p><section class="controls"><label>Produkt<select id="recipe-select"><option>Lade Datenbasis...</option></select></label><label id="target-container" style="display:none">Zielrate<div><input id="target-rate" type="number" min="0" step="0.1"><span>/ min</span></div></label></section><section id="dashboard-card" class="stats" style="display:none"><div><small>Gesamt-Maschinen</small><strong id="stat-machines">0</strong></div><div><small>Strombedarf</small><strong id="stat-power">0 MW</strong></div></section><section class="panel"><h2>Produktionskette</h2><div id="status-output">Lade Datenbasis...</div></section></main><script type="module" src="app.js"></script></body></html>
